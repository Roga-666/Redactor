name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          echo "Using Android SDK at ${ANDROID_HOME}"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Reject network permissions in packaged APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)'; then
            echo 'Unexpected networking permission in merged Android manifest!' >&2
            exit 1
          fi
      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redactor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
