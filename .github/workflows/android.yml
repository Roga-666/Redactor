name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write # Required only to publish versioned prerelease APK assets on main.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          echo "Using Android SDK at ${ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Reject network permissions in packaged APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)'; then
            echo 'Unexpected networking permission in merged Android manifest!' >&2
            exit 1
          fi
      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redactor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK to GitHub Releases (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          ASSET="Redactor-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Existing v${VERSION} release preserved; not replacing its signing key."
          else
            gh release create "v${VERSION}" "$ASSET" --target "$GITHUB_SHA" --title "Redactor v${VERSION} (experimental)" --prerelease \
              --notes "Experimental fully offline Android redaction prototype. Every page requires manual review. Debug-signed APKs may not install over previous builds without uninstalling; export presets first. Do not rely on this as certified secure redaction software."
          fi
